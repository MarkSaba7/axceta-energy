<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consommation — Maison</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #16181d; --muted: #667085; --border: #e4e7ec;
    --accent: #1f6feb; --ok: #12805c; --ok-bg: #ecfdf3; --alert: #c4320a; --alert-bg: #fff1ec;
    --area: rgba(31, 111, 235, .12); --band: rgba(196, 50, 10, .09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --text: #e6e8ec; --muted: #98a2b3; --border: #262b36;
      --accent: #4c8dff; --ok: #3ccb8f; --ok-bg: rgba(60, 203, 143, .12); --alert: #ff7a50;
      --alert-bg: rgba(255, 122, 80, .12); --area: rgba(76, 141, 255, .15); --band: rgba(255, 122, 80, .12);
    }
  }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
  header, .panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header { margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .sub, .hint { color: var(--muted); margin: 2px 0 0; font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card, .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .panel { margin-top: 12px; }
  h2 { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; }
  .panel-head { margin-bottom: 10px; } .panel-head h2 { margin: 0; }
  .big { font-size: 30px; font-weight: 650; margin: 0; font-variant-numeric: tabular-nums; }
  .badge { padding: 5px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.alert { background: var(--alert-bg); color: var(--alert); }
  .peak-ctl { display: flex; gap: 8px; align-items: center; }
  button, select { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); }
  button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  button.danger { color: var(--alert); }
  button:disabled { opacity: .45; cursor: default; }
  select { background: var(--panel); color: var(--text); }
  form { display: flex; gap: 8px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 8px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .name { font-weight: 600; } .meta { color: var(--muted); font-size: 12px; }
  .conn { white-space: nowrap; }
  .conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
  .conn.online::before { background: var(--ok); }
  .conn.offline { color: var(--muted); }
  .tag { margin-left: 6px; font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--alert-bg); color: var(--alert); }
  .actions { text-align: right; white-space: nowrap; } .actions button { margin-left: 4px; }
  #chart { width: 100%; height: 140px; display: block; }
  .line { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .area { fill: var(--area); } .band { fill: var(--band); }
  .error { background: var(--alert-bg); color: var(--alert); padding: 10px 14px; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Consommation électrique</h1>
      <p class="sub">Maison · données reçues du cloud en temps réel</p>
    </div>
    <div class="peak-ctl">
      <span id="peak-badge" class="badge ok">…</span>
      <button id="peak-btn" class="ghost">Simuler une pointe</button>
    </div>
  </header>

  <p id="error" class="error" hidden></p>

  <section class="cards">
    <article class="card"><h2>Actuellement</h2><p class="big" id="current">—</p><p class="hint" id="current-hint"></p></article>
    <article class="card"><h2>Aujourd'hui</h2><p class="big" id="today">—</p><p class="hint" id="cost"></p></article>
    <article class="card"><h2>Pendant les pointes</h2><p class="big" id="today-peak">—</p><p class="hint" id="peak-hint"></p></article>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Dernière heure</h2><span class="hint" id="chart-hint"></span></div>
    <svg id="chart" viewBox="0 0 600 140" preserveAspectRatio="none" role="img" aria-label="Puissance totale, dernière heure"></svg>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Appareils</h2>
      <form id="add" title="Lance un nouveau conteneur Docker">
        <select id="type" aria-label="Type d'appareil"></select>
        <button>Ajouter un appareil</button>
      </form>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Appareil</th><th>Connexion</th><th class="num">Puissance</th><th class="num">Courant</th><th class="num">Aujourd'hui</th><th></th></tr></thead>
        <tbody id="devices"></tbody>
      </table>
    </div>
    <p id="empty" class="hint">Aucun appareil. Ajoutes-en un : il s'enregistre tout seul dès qu'il se connecte.</p>
  </section>
</main>

<script>
const TYPES = { lamp: 'Lampe', powerbar: 'Barre multiprise', fridge: 'Réfrigérateur', heater: 'Plinthe électrique', ev_charger: 'Borne VÉ' };
const fmt = (digits) => new Intl.NumberFormat('fr-CA', { minimumFractionDigits: digits, maximumFractionDigits: digits });
const W = fmt(0), KWH = fmt(2), A = fmt(2), WH = fmt(1);
const energy = (kwh) => (kwh < 1 ? `${WH.format(kwh * 1000)} Wh` : `${KWH.format(kwh)} kWh`);
const MONEY = new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD' });
const $ = (sel) => document.querySelector(sel);
const enc = encodeURIComponent;
const rows = new Map();
let last = null;
let sim = { types: [], containers: {} };

async function call(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body && JSON.stringify(body) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function showError(msg) { $('#error').textContent = msg; $('#error').hidden = false; }

async function tick() {
  const [state, docker] = await Promise.allSettled([call('GET', '/api/state'), call('GET', '/sim/devices')]);
  if (docker.status === 'fulfilled') sim = docker.value;
  $('#add').hidden = docker.status !== 'fulfilled';  // sans Docker : pas de simulation, données cloud seulement
  if (!$('#type').options.length && sim.types.length) {
    $('#type').innerHTML = sim.types.map((t) => `<option value="${t}">${TYPES[t] ?? t}</option>`).join('');
  }
  if (state.status === 'rejected') return showError(`Cloud injoignable : ${state.reason.message}`);
  $('#error').hidden = true;
  render(state.value);
}

function render(s) {
  last = s;
  const online = s.devices.filter((d) => d.online).length;
  $('#current').textContent = `${W.format(s.current_w)} W`;
  $('#current-hint').textContent = `${online} appareil${online > 1 ? 's' : ''} en ligne sur ${s.devices.length}`;
  $('#today').textContent = energy(s.today_kwh);
  $('#cost').textContent = `≈ ${MONEY.format(s.today_cost)} depuis minuit`;
  $('#today-peak').textContent = energy(s.today_peak_kwh);
  const pct = s.today_kwh ? Math.round((100 * s.today_peak_kwh) / s.today_kwh) : 0;
  $('#peak-hint').textContent = `${pct} % de la consommation du jour`;
  $('#peak-badge').textContent = s.peak_active ? 'Pointe en cours · délestage actif' : 'Hors pointe';
  $('#peak-badge').className = `badge ${s.peak_active ? 'alert' : 'ok'}`;
  $('#peak-btn').textContent = s.peak_override === null ? 'Simuler une pointe' : "Revenir à l'horaire";
  chart(s.history);
  devices(s.devices);
}

function chart(hist) {
  const t0 = Date.now() / 1000 - 3600;
  const max = Math.max(100, ...hist.map((p) => p.w)) * 1.15;
  const x = (t) => ((t - t0) / 3600) * 600;
  const y = (w) => 140 - (w / max) * 140;
  const bands = hist.filter((p) => p.peak).map((p) => `<rect class="band" x="${x(p.t)}" y="0" width="10" height="140"/>`);
  const pts = hist.map((p) => `${x(p.t + 30)},${y(p.w)}`);
  const area = pts.length ? `<polygon class="area" points="${x(hist[0].t + 30)},140 ${pts.join(' ')} ${x(hist.at(-1).t + 30)},140"/>` : '';
  $('#chart').innerHTML = bands.join('') + area + (pts.length ? `<polyline class="line" points="${pts.join(' ')}"/>` : '');
  $('#chart-hint').textContent = hist.length
    ? `puissance moyenne par minute · max ${W.format(Math.max(...hist.map((p) => p.w)))} W · zones orangées = pointe`
    : 'le graphique apparaît après la première minute complète';
}

const ROW = `<td><div class="name"></div><div class="meta"></div></td>
  <td><span class="conn"></span><span class="tag" hidden>délesté</span></td>
  <td class="num power"></td><td class="num amps"></td><td class="num today"></td>
  <td class="actions"><button data-act="power"></button><button data-act="network" class="ghost"></button><button data-act="remove" class="ghost danger">Retirer</button></td>`;

function devices(list) {
  for (const d of list) {
    let tr = rows.get(d.id);
    if (!tr) {
      tr = document.createElement('tr');
      tr.dataset.id = d.id;
      tr.innerHTML = ROW;
      rows.set(d.id, tr);
      $('#devices').append(tr);
    }
    const q = (sel) => tr.querySelector(sel);
    const container = sim.containers[d.id];
    q('.name').textContent = d.id;  // textContent : l'id vient de l'appareil, jamais injecté en HTML
    q('.meta').textContent = `${TYPES[d.type] ?? d.type ?? 'inconnu'} · v${(d.version || '?').slice(0, 7)}`;
    q('.conn').className = `conn ${d.online ? 'online' : 'offline'}`;
    q('.conn').textContent = d.online ? 'En ligne' : container === 'paused' ? 'Hors ligne (réseau coupé)' : 'Hors ligne';
    q('.tag').hidden = !d.shed;
    q('.power').textContent = !d.online ? '—' : d.is_on ? `${W.format(d.power_w)} W` : 'Éteint';
    q('.amps').textContent = d.online && d.is_on ? `${A.format(d.current_a)} A` : '—';
    q('.today').textContent = `${WH.format(d.today_wh)} Wh`;
    q('[data-act=power]').textContent = d.is_on ? 'Éteindre' : 'Allumer';
    q('[data-act=power]').disabled = !d.online;
    q('[data-act=network]').hidden = !container;
    q('[data-act=network]').textContent = container === 'paused' ? 'Rétablir le réseau' : 'Couper le réseau';
  }
  const ids = new Set(list.map((d) => d.id));
  for (const [id, tr] of rows) if (!ids.has(id)) { tr.remove(); rows.delete(id); }
  $('#empty').hidden = list.length > 0;
}

$('#devices').addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const id = btn.closest('tr').dataset.id;
  const d = last.devices.find((x) => x.id === id);
  try {
    if (btn.dataset.act === 'power') await call('POST', `/api/devices/${enc(id)}/power`, { on: !d.is_on });
    if (btn.dataset.act === 'network') {
      await call('POST', `/sim/devices/${enc(id)}/network/${sim.containers[id] === 'paused' ? 'restore' : 'cut'}`);
    }
    if (btn.dataset.act === 'remove') {
      if (!confirm(`Retirer ${id} ? Son conteneur sera supprimé.`)) return;
      if (sim.containers[id]) await call('DELETE', `/sim/devices/${enc(id)}`);
      await call('DELETE', `/api/devices/${enc(id)}`);
    }
  } catch (err) { showError(err.message); }
  tick();
});

$('#add').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { await call('POST', '/sim/devices', { type: $('#type').value }); } catch (err) { showError(err.message); }
});

$('#peak-btn').addEventListener('click', async () => {
  try { await call('POST', '/api/peak', { active: last?.peak_override === null ? true : null }); } catch (err) { showError(err.message); }
  tick();
});

setInterval(tick, 1000);
tick();
</script>
</body>
</html>
